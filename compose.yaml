# Ambiente de desenvolvimento local (LLD, seção 10).
# Os apps não sobem sozinhos: depois do `docker compose up -d`, rode
#   docker compose exec chat-api pnpm start:dev
#   docker compose exec web pnpm dev
name: fullcycle-slack-ia

services:
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "3000:3000"
    environment:
      # Variáveis da web (LLD, "Valores e configuração"); só locais.
      CHAT_API_URL: http://chat-api:3000
      SESSION_COOKIE_DOMAIN: ""
    volumes:
      - .:/home/node/app
    depends_on:
      - chat-api

  e2e:
    # Playwright dos testes de ponta a ponta da web e do playwright-cli. A versão da imagem é a
    # mesma, exata, do @playwright/test do package.json da web; uma muda junto com a outra.
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["e2e"]
    init: true
    # O usuário do host, para os artefatos gravados no repositório montado terem o dono certo.
    user: "1000:1000"
    working_dir: /home/node/app/apps/web
    environment:
      HOME: /tmp
      # As fixtures gravam e limpam os dados dos testes no banco chat (LLD, "Ambiente de
      # desenvolvimento").
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
    volumes:
      - .:/home/node/app
    # Não roda os testes: só encaminha localhost:3000 e localhost:3001 para a web e a API do chat.
    command: ["node", "/home/node/app/docker/e2e/forward-ports.mjs"]
    depends_on:
      - web

  chat-api:
    build:
      context: apps/chat-api
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "3001:3000"
    environment:
      # Variáveis da API do chat (LLD, "Valores e configuração"); só locais.
      DATABASE_URL: postgres://chat:chat@postgres:5432/chat
      LOG_LEVEL: info
    volumes:
      - .:/home/node/app
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data", "-s3.autoCreateBucket=false"]
    environment:
      # Credenciais falsas, só locais. Com elas o S3 exige assinatura, como em produção.
      AWS_ACCESS_KEY_ID: local-access-key
      AWS_SECRET_ACCESS_KEY: local-secret-key
      S3_BUCKET: reports
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      # Sem assinatura o S3 responde 403; qualquer resposta HTTP indica que está de pé.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  s3-data:
